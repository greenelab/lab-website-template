- title: Mentoring
  icon: fa-solid fa-user-graduate
  description: Mentoring of early-career researchers beyond the lab's own students.
  items:
    - role: Mentor
      organization: AI Grid
      detail: >-
        Accompanying a master's or doctoral researcher in AI for a year, within a network of
        micro focus groups for early-career AI talent funded by the German Federal Ministry
        of Education and Research.
      person: reza-sabzevari
      link: https://ai-grid.org/en/

- title: Policy papers
  icon: fa-solid fa-file-signature
  description: Contributions to position and policy papers that feed into European research and innovation agendas.
  items:
    - role: Contributing author
      organization: "Policy Paper and Technology Roadmap: GenAI and Robotics 4EU"
      detail: >-
        Adra Association paper on the convergence of generative AI and robotics in Europe,
        covering safety, explainability, cybersecurity, sustainability, data and computing
        infrastructure, and open-source digital commons.
      period: 2024
      person: reza-sabzevari
      link: https://adr-association.eu/news/adra-releases-policy-paper-and-technology-roadmap-genai-and-robotics-4eu
