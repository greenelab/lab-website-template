- title: "How Wall-E contributes to Europe's autonomy"
  type: Talk
  outlet: TU Delft Critical Raw Materials Week, Collegerama
  date: "2024-05-16"
  description: >-
    A lunch lecture by the TU Delft Climate Action Programme and the Delft Energy Initiative during
    Critical Raw Materials Week. Together with Feven Desta (Civil Engineering and Geosciences), Reza
    Sabzevari discussed how robotics can help Europe secure critical raw materials, from exploration
    and mining to recycling. The recording is available on Collegerama.
