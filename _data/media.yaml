- title: "The race for 1,800 billion dollars: who will rule space?"
  type: Press
  outlet: Algemeen Dagblad (AD), in Dutch
  date: "2026-01-23"
  description: >-
    In AD's long read on the new space race, Reza Sabzevari explains why robotics will be essential
    beyond Earth. Experiments with "factories" in space have already begun on the ISS, and anyone who
    wants to live on the Moon or Mars will have to produce things there rather than ship everything
    from Earth. He describes swarms of communicating robots that map and help mine the lunar surface,
    and notes that the European Space Agency has named robotics one of its key technologies.
  link: https://www.ad.nl/redactie/2026/de-race-om-1-800-miljard-dollar-wie-wordt-baas-in-de-ruimte/
  image: images/media/ad-space-race.jpg

