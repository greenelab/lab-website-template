- title: Modeling and Simulation of Disruption for Resilient Infrastructures
  icon: fa-solid fa-tower-broadcast
  image: images/projects/resilient-infrastructure.svg
  description: >-
    Critical infrastructure must keep working when parts of it fail. We build perception-driven
    digital models of infrastructure and simulate how disruptions emerge and propagate through
    them, so that operators can anticipate failures, stress-test response strategies, and plan
    inspection, repair and maintenance for more resilient systems.
  tags:
    - simulation
    - resilience
  people:
    - saman-behrouzi
  sponsors:
    - name: TU Delft Safety and Security Institute
      logo: images/sponsors/tudelft.svg
      caption: Safety & Security Institute
      link: https://www.tudelft.nl/en/safety-security-institute

- title: Open-Source Interactive Education Materials for ML and Foundation Models
  icon: fa-solid fa-laptop-code
  image: images/projects/education-materials.svg
  description: >-
    We develop open, interactive learning materials (notebooks, visual demos and hands-on
    exercises) that let students explore machine learning and foundation models by running
    and modifying them, rather than only reading about them. The materials are used in our
    courses and are freely available for others to reuse.
  tags:
    - education
    - open source
  vacancies:
    - ra-foundation-models
    - ta-dl4cv
  sponsors:
    - name: ELLIS Unit Delft
      logo: images/sponsors/ellis.png
      caption: Unit Delft
      link: https://ellis.eu/units/delft
    - name: TU Delft Machine Learning Teachers Community
      logo: images/sponsors/tudelft.svg
      caption: ML Teachers Community
      link: https://www.tudelft.nl/ai/onderwijs/ai-onderwijsinnovatie/machine-learning-teachers-community
