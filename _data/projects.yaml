- title: Transferable Spatial Intelligence
  icon: fa-solid fa-cube
  image: images/research/T-FunS3D_teaser.png
  link: projects/transferable-spatial-intelligence
  description: >-
    Robots that understand a 3D scene not only as geometry, but as objects, their functional parts,
    and what can be done with them, and that carry this understanding across environments, tasks
    and embodiments. We combine 3D scene graphs with vision-language foundation models to obtain
    open-vocabulary, task-driven perception that transfers to new settings without retraining.
    Outcomes so far include **T-FunS3D** (ICRA 2026) and a live open-vocabulary navigation and
    manipulation demo at **Robots in Business 2026**.
  tags:
    - scene understanding
    - foundation models
  people:
    - jingkun-feng
    - antreas-kourris
  vacancies:
    - TA-tfuns3d-demo
  sponsors:
    - name: TU Delft Faculty of Aerospace Engineering
      logo: images/sponsors/tudelft.svg
      caption: Aerospace Engineering
      link: https://www.tudelft.nl/en/ae
    - name: TU Delft Robotics Institute
      logo: images/sponsors/tudelft.svg
      caption: Robotics Institute
      link: https://www.tudelft.nl/en/robotics-institute

- title: "Luchtvaart in Transitie (LiT): Aviation in Transition"
  icon: fa-solid fa-plane
  image: images/projects/aviation-transition.svg
  link: projects/lit
  description: >-
    Luchtvaart in Transitie is a Dutch national programme that brings together government, knowledge
    institutes and industry to accelerate the transition to climate-neutral aviation by 2050. Within
    LiT, p4MARS contributes perception and AI for the production and maintenance of next-generation
    aircraft through two activities: fine-detailed 3D modeling for monitoring manufacturing
    processes, and automated non-destructive testing.
  tags:
    - aviation
    - sustainability
  sponsors:
    - name: Dutch National Growth Fund
      text: Nationaal Groeifonds
      caption: National Growth Fund
      link: https://www.nationaalgroeifonds.nl/english
  activities:
    - title: Fine-Detailed 3D Modeling for Monitoring Manufacturing Processes
      icon: fa-solid fa-industry
      image: images/projects/manufacturing-3d.svg
      description: >-
        Advanced manufacturing needs to see what is happening to a part while it is being made.
        We develop high-fidelity 3D and 4D reconstruction methods that capture fine geometric
        detail and its evolution over time, turning sensor streams into evolving digital twins of
        the process. Applications include in-process inspection and quality control, and the
        manufacturing and recycling of composite structures.
      tags:
        - 4D reconstruction
        - digital twins
      people:
        - samuel-bruin
        - xuejiao-luo
    - title: Automated Non-Destructive Testing (NDT)
      icon: fa-solid fa-magnifying-glass-chart
      image: images/projects/automated-ndt.svg
      description: >-
        Inspecting aircraft structures for hidden damage is slow, manual work. We develop robotic,
        perception-driven non-destructive testing that plans and executes inspections autonomously,
        registers sensor data to a digital model of the part, and flags defects for maintenance.
      tags:
        - inspection
        - NDT
      vacancies:
        - postdoc-lit

